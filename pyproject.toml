[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dssc-discovery"
version = "0.0.1"
description = "Closed-loop ML/BO platform for natural-pigment DSSC discovery"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
