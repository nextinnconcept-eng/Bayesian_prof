[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dssc-discovery"
version = "0.0.1"
description = "Closed-loop ML/BO platform for natural-pigment DSSC discovery"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "shap>=0.46",
    "gpytorch>=1.13",
    "botorch>=0.12",
    "mlflow>=2.16",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pint>=0.24",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
ui = [
    "streamlit>=1.38",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# alembic/versions: autogenerated migrations, reviewed via diff not lint --
# column definitions with long enum value lists routinely exceed line-length
# and that's fine, it'll recur on every future migration.
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
# Matches the actual dev/CI runtime (3.13), not requires-python's 3.11
# floor -- pinning this to 3.11 makes mypy fail to parse 3.12+ syntax
# inside third-party packages (e.g. pint) rather than just checking our
# code. Ruff's target-version = "py311" still guards our own code's
# compatibility with the 3.11 floor.
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["^\\.venv/"]
