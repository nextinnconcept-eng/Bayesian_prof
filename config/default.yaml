# Default configuration for dssc_discovery.
# Any value here can be overridden by an environment variable prefixed
# DSSC_ (e.g. DSSC_RANDOM_SEED=123), or by a local .env file (see
# .env.example). Precedence: env var > .env file > this file > field default.
# Paths are relative to the repository root by convention.

database_url: "sqlite:///data/dssc_discovery_dev.db"
mlflow_tracking_uri: "./mlruns"
random_seed: 42
data_dir: "data"
log_level: "INFO"
log_dir: "logs"
